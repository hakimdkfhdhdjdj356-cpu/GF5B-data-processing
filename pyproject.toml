[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ahsi-pipeline"
version = "2.0.0"
description = "Configuration-driven L1 preprocessing pipeline for Chinese spaceborne hyperspectral (AHSI) data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ahsi-pipeline contributors" }]
keywords = ["hyperspectral", "remote-sensing", "AHSI", "GF-5B", "radiometric-calibration", "atmospheric-correction"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy>=1.24",
    "rasterio>=1.3",
    "PyYAML>=6.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "Pillow>=9.5",
    "fiona>=1.9",
    "shapely>=2.0",
    "pandas>=2.0",
]

[project.optional-dependencies]
# 6SV 后端为可选：需本机另行安装 6S V1.1 可执行文件与 Py6S。
sixs = ["Py6S>=1.9"]
dev = ["build>=1.0", "twine>=4.0"]

[project.scripts]
ahsi = "ahsi.cli:main"

[project.urls]
Homepage = "https://github.com/hakimdkfhdhdjdj356-cpu/ahsi-pipeline"
Issues = "https://github.com/hakimdkfhdhdjdj356-cpu/ahsi-pipeline/issues"

[tool.setuptools]
packages = ["ahsi"]
