name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Byte-compile
        run: python -m compileall -q ahsi scripts

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Guard against committed raster data
        shell: bash
        run: |
          if git ls-files | grep -Ei '\.(tif|tiff|dat|img|hdr|rpb|raw|vrt)$'; then
            echo "::error::Binary raster data must not be committed to this repository."
            exit 1
          fi
          echo "No raster data files tracked."

  lint-metadata:
    name: Validate repository metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that configs parse and defaults contain no machine paths
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyYAML
          python - <<'PY'
          import pathlib, sys, yaml
          markers = ("C:/Users", "F:/", "F:\\", "/home/", "/Users/")
          files = sorted(pathlib.Path("config").glob("*.yaml")) + sorted(pathlib.Path("config").glob("*.example"))
          for p in files:
              text = p.read_text(encoding="utf-8")
              if "${ENV:" not in text:
                  yaml.safe_load(text)
              for marker in markers:
                  if marker in text:
                      sys.exit(f"machine-specific path marker {marker!r} found in {p}")
          print(f"checked {len(files)} config files")
          PY
