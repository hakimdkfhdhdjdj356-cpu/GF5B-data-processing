name: "\u2728 功能建议"
description: 提出新的传感器支持、后端、QC 检查项或工程改进
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 说明当前行为为什么不够用，尽量给出具体场景
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法
      description: 涉及哪些 stage / 后端 / 配置字段？是否会改变已有产物的数值或标签？
    validations:
      required: true
  - type: dropdown
    id: product-grade
    attributes:
      label: 是否涉及产品等级变化
      description: 相对反射率与地表反射率必须严格隔离，任何相关改动都需要额外审查
      options:
        - 否，纯工程改进
        - 是，涉及新的产品或标签
        - 不确定
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: textarea
    id: validation
    attributes:
      label: 建议的验证方式
      description: 如何证明改动没有破坏既有数值与可复现性？
